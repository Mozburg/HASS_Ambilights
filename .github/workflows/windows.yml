name: windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # needed to attach the exe to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      - name: Run the test suite on Windows
        run: python tests/test_hass_ambilights.py

      - name: Generate icon, splash and version resource
        run: |
          python packaging/make_assets.py
          python packaging/make_splash.py

      - name: Build one-file exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name HassAmbilights `
            --icon packaging/icon.ico `
            --splash packaging/splash.png `
            --version-file packaging/version_info.txt `
            --collect-submodules uvicorn `
            --collect-submodules pystray `
            --collect-submodules webview `
            --hidden-import pystray._win32 `
            --exclude-module matplotlib `
            hass_ambilights.py

      - name: Smoke test (server mode, no display needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:DRY_RUN = "1"
          $env:HA_URL = "http://127.0.0.1:9"
          $env:BIND_PORT = "8123"
          $env:CONFIG_FILE = Join-Path $env:TEMP "hass-ambilights-ci.json"
          $exe = "dist\HassAmbilights.exe"
          if (-not (Test-Path $exe)) { throw "exe not built" }

          $proc = Start-Process -FilePath $exe -ArgumentList "--server", "--no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8123/health" -TimeoutSec 2
              $h | ConvertTo-Json -Depth 3 | Select-Object -First 1 | Write-Host
              $version = $h.version
              $ok = $true
              break
            } catch { }
            if ($proc.HasExited) { break }
          }
          if (-not $ok) {
            Write-Host "--- log ---"
            $log = Join-Path $env:LOCALAPPDATA "HassAmbilights\logs\app.log"
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "the exe never answered /health"
          }
          Write-Host "health ok, version $version"
          $page = Invoke-WebRequest -Uri "http://127.0.0.1:8123/" -UseBasicParsing -TimeoutSec 5
          if ($page.Content -notmatch "HASS Ambilights") { throw "settings page did not render" }
          # a fresh install has no token, so the wizard must be what a first run lands on
          $welcome = Invoke-WebRequest -Uri "http://127.0.0.1:8123/welcome" -UseBasicParsing -TimeoutSec 5
          if ($welcome.Content -notmatch "Set up HASS Ambilights") { throw "/welcome did not render" }
          $update = Invoke-RestMethod -Uri "http://127.0.0.1:8123/api/update" -TimeoutSec 5
          if ($update.current -ne $version) { throw "updater reports $($update.current), exe says $version" }
          # a one-file exe is a bootloader plus a child; killing the PID that
          # Start-Process returned can leave the app running and holding the port
          Get-Process HassAmbilights -ErrorAction SilentlyContinue | Stop-Process -Force
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Milliseconds 500
            if (-not (Get-Process HassAmbilights -ErrorAction SilentlyContinue)) { break }
          }
          if (Get-Process HassAmbilights -ErrorAction SilentlyContinue) {
            throw "the smoke-test app survived Stop-Process"
          }
          if ($version -ne "$((Get-Content hass_ambilights.py | Select-String '__version__ = "([0-9.]+)"').Matches.Groups[1].Value)") {
            throw "exe reports $version, source says something else"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # A failed step only says "exit code 1", and the job log needs repo admin.
          # Emitting the compiler's own words as an annotation makes the reason visible
          # on the run page and through the checks API.
          function Emit-Failure([string]$text) {
            $flat = ($text -replace "`r?`n", " | ")
            if ($flat.Length -gt 3000) { $flat = $flat.Substring(0, 3000) + " ..." }
            Write-Host "::error title=Installer::$flat"
          }

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            try { choco install innosetup --no-progress -y } catch { Write-Host "choco: $_" }
          }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) {
            Emit-Failure "Inno Setup 6 was not found and choco could not install it"
            throw "Inno Setup 6 is not available on this runner"
          }
          $innoVersion = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "using $iscc ($innoVersion)"

          $version = (python packaging/make_assets.py --version).Trim()
          if (-not $version) {
            Emit-Failure "make_assets.py --version printed nothing"
            throw "could not read __version__"
          }

          # Start-Process, not `&`: no PowerShell stream semantics, a real exit code, and
          # stdout/stderr kept apart so a warning cannot masquerade as a failure.
          $out = Join-Path $env:TEMP "iscc.out"
          $err = Join-Path $env:TEMP "iscc.err"
          $proc = Start-Process -FilePath $iscc `
            -ArgumentList @("/DAppVersion=$version", "packaging\hass-ambilights.iss") `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = @()
          if (Test-Path $out) { $text += Get-Content $out }
          if (Test-Path $err) { $text += Get-Content $err }
          $text | ForEach-Object { Write-Host $_ }
          if ($proc.ExitCode -ne 0) {
            Emit-Failure ($text -join "`n")
            "### ISCC failed (exit $($proc.ExitCode))" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            $text | Out-File -Append $env:GITHUB_STEP_SUMMARY
            throw "ISCC failed (exit $($proc.ExitCode))"
          }

          $setup = "dist\HassAmbilights-Setup-$version.exe"
          if (-not (Test-Path $setup)) {
            Emit-Failure "ISCC reported success but $setup does not exist"
            throw "$setup was not produced"
          }

          $sums = foreach ($file in @("dist\HassAmbilights.exe", $setup)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $sums | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt" | Write-Host

      - name: Install, run from the install path, then uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Anything that escapes the checks below still has to explain itself: a failed
          # step only says "exit code 1", and the job log needs repo admin.
          function Emit-Failure([string]$text) {
            $flat = ($text -replace "`r?`n", " | ")
            if ($flat.Length -gt 3000) { $flat = $flat.Substring(0, 3000) + " ..." }
            Write-Host "::error title=Installed app::$flat"
          }

          function Wait-Gone {
            for ($i = 0; $i -lt 20; $i++) {
              if (-not (Get-Process HassAmbilights -ErrorAction SilentlyContinue)) { return $true }
              Start-Sleep -Milliseconds 500
            }
            return $false
          }

          function Stop-App {
            Get-Process HassAmbilights -ErrorAction SilentlyContinue | Stop-Process -Force
            return (Wait-Gone)
          }

          try {
            $version = (python packaging/make_assets.py --version).Trim()
            $setup = "dist\HassAmbilights-Setup-$version.exe"
            $installed = Join-Path $env:LOCALAPPDATA "Programs\HASS Ambilights"
            $data = Join-Path $env:APPDATA "HassAmbilights"
            $logs = Join-Path $env:LOCALAPPDATA "HassAmbilights\logs"
            $exe = Join-Path $installed "HassAmbilights.exe"

            # nothing of ours may be running while the installer works
            if (-not (Stop-App)) {
              Emit-Failure "an app instance survived Stop-Process before the install"
              throw "could not clear running instances"
            }

            # the installer must run with no interaction at all
            $p = Start-Process -FilePath $setup `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
              -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Emit-Failure "installer exited $($p.ExitCode)"
              throw "installer exited $($p.ExitCode)"
            }
            if (-not (Test-Path $exe)) {
              $seen = @(Get-ChildItem $installed -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty Name) -join ", "
              Emit-Failure "no exe at $installed (found: $seen)"
              throw "the exe is not under $installed"
            }
            $uninstaller = Join-Path $installed "unins000.exe"
            if (-not (Test-Path $uninstaller)) {
              Emit-Failure "no uninstaller was written to $installed"
              throw "no uninstaller was written"
            }
            # [Run] is skipifsilent: a silent install must not leave the app behind
            if (Get-Process HassAmbilights -ErrorAction SilentlyContinue) {
              Emit-Failure "the silent install started the app - [Run] must stay skipifsilent"
              throw "the silent install started the app"
            }

            # the installed copy is a working app (env vars, not -Environment: this has
            # to work on any PowerShell 7 build)
            $env:BIND_PORT = "8125"
            $env:DRY_RUN = "1"
            $env:HA_URL = "http://127.0.0.1:9"
            $env:CONFIG_FILE = (Join-Path $env:TEMP "installed-ci.json")
            $proc = Start-Process -FilePath $exe -ArgumentList "--server", "--no-browser" -PassThru
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:8125/health" -TimeoutSec 2
                if ($h.version -eq $version) { $ok = $true; break }
              } catch { }
              if ($proc.HasExited) { break }
            }
            Remove-Item Env:BIND_PORT, Env:DRY_RUN, Env:HA_URL, Env:CONFIG_FILE -ErrorAction SilentlyContinue
            if (-not $ok) {
              $log = Join-Path $logs "app.log"
              $tail = if (Test-Path $log) { (Get-Content $log -Tail 25) -join " | " } else { "no log written" }
              Emit-Failure "the installed exe never answered /health as $version (exited: $($proc.HasExited)): $tail"
              Stop-App | Out-Null
              throw "the installed exe never answered /health as $version"
            }
            Write-Host "installed app answered /health as $version"

            # the uninstall is a clean reset: seed everything it writes, prove none survives
            Stop-App | Out-Null
            $cfg = Join-Path $data "config.json"
            New-Item -ItemType Directory -Force -Path $data | Out-Null
            '{"HA_URL":"http://127.0.0.1:9"}' | Set-Content -Encoding ascii $cfg
            New-Item -ItemType Directory -Force -Path $logs | Out-Null
            'line' | Set-Content -Encoding ascii (Join-Path $logs "app.log")
            New-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" `
              -Name "HassAmbilights" -Value "C:\gone.exe" -PropertyType String -Force | Out-Null

            # the uninstaller re-launches itself from %TEMP%, so -Wait returns before the
            # files are gone: poll rather than race it
            $q = Start-Process -FilePath $uninstaller `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($q.ExitCode -ne 0) {
              Emit-Failure "uninstaller exited $($q.ExitCode)"
              throw "uninstaller exited $($q.ExitCode)"
            }
            $gone = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if (-not (Test-Path $exe)) { $gone = $true; break }
            }
            if (-not $gone) {
              Emit-Failure "the exe survived the uninstall"
              throw "the exe survived the uninstall"
            }

            $left = @()
            if (Test-Path $data) { $left += "settings $data" }
            if (Test-Path $logs) { $left += "logs $logs" }
            if (Test-Path $installed) { $left += "install dir $installed" }
            if (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" `
                  -Name "HassAmbilights" -ErrorAction SilentlyContinue) { $left += "Run key" }
            if ($left.Count -gt 0) {
              Emit-Failure ("the clean reset left: " + ($left -join ", "))
              throw ("uninstall left: " + ($left -join ", "))
            }
            Write-Host "uninstall was a clean reset: program, settings, logs and login entry gone"
          } catch {
            $at = $_.InvocationInfo
            Emit-Failure ("line " + $at.ScriptLineNumber + ": " + ("$($at.Line)".Trim()) + " -> " + $_.Exception.Message)
            throw
          }

      - name: Upload the exe and the installer
        uses: actions/upload-artifact@v4
        with:
          name: HassAmbilights-windows
          path: |
            dist/HassAmbilights.exe
            dist/HassAmbilights-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HassAmbilights.exe
            dist/HassAmbilights-Setup-*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
