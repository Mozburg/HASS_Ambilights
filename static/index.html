<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen → Lights</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --line:#2b333d;
    --text:#e6edf3; --muted:#8b949e; --accent:#4493f8; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;display:flex;gap:16px;align-items:center;
    padding:12px 20px;background:rgba(13,17,23,.92);border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .live{display:flex;gap:14px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.bad{background:var(--bad)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:20px;max-width:1180px;margin:0 auto}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px}
  .card h2{margin:0;padding:12px 16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);border-bottom:1px solid var(--line)}
  .card .body{padding:14px 16px}
  .row{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start;padding:9px 0;
    border-top:1px dashed rgba(255,255,255,.06)}
  .row:first-child{border-top:0}
  .row .label{font-weight:500}
  .row .help{color:var(--muted);font-size:12px;margin-top:2px}
  .ctl{display:flex;gap:10px;align-items:center}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=number],input[type=text],select{background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit}
  input[type=number]{width:78px}
  input[type=text]{width:100%;font-family:ui-monospace,monospace;font-size:12px}
  select{min-width:140px}
  .val{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#30363d;border-radius:99px;transition:.15s;cursor:pointer}
  .switch span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;
    background:#e6edf3;border-radius:50%;transition:.15s}
  .switch input:checked + span{background:var(--accent)}
  .switch input:checked + span:before{transform:translateX(20px)}
  .light{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
    padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;background:var(--panel2)}
  .zones{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,26px);gap:3px}
  .zones button{background:#222932;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:11px;cursor:pointer;padding:0}
  .zones button.on{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:700}
  .zones button:hover{border-color:var(--accent)}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;
    padding:7px 12px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1118;font-weight:600}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  aside .card{position:sticky;top:74px}
  .swatch{height:96px;border-radius:9px;border:1px solid var(--line);background:#000;
    display:flex;align-items:flex-end;justify-content:space-between;padding:8px;font-size:11px;
    font-family:ui-monospace,monospace;text-shadow:0 1px 3px #000}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-top:1px dashed rgba(255,255,255,.06)}
  .kv:first-child{border-top:0}
  .kv b{font-weight:500;color:var(--muted)}
  .zonebits{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:6px 0}
  .zonebits div{height:14px;border-radius:3px;background:#222932}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 16px;
    transition:.2s;max-width:80vw;z-index:20}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:var(--bad);color:#ffb4ae}
  small.mono{font-family:ui-monospace,monospace;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Screen → Lights</h1>
  <span class="live">
    <span id="dot" class="dot"></span><span id="conn">connecting</span>
    <span id="hapill" class="mono"></span>
  </span>
</header>

<main>
  <div>
    <div id="settings"></div>

    <div class="card">
      <h2>Lights</h2>
      <div class="body">
        <div id="lights"></div>
        <div class="actions" style="margin-top:6px">
          <button class="btn" onclick="addLight()">+ Add light</button>
          <small class="mono">zones are 3×3 in reading order · 1 2 3 / 4 5 6 / 7 8 9</small>
        </div>
      </div>
    </div>

    <div class="actions" style="position:sticky;bottom:0;padding:14px 0;
      background:linear-gradient(transparent,var(--bg) 40%)">
      <button class="btn primary" onclick="save()">Save &amp; apply</button>
      <button class="btn" onclick="reload()">Revert</button>
      <button class="btn danger" onclick="resetDefaults()">Reset to defaults</button>
      <small class="mono" id="cfgpath"></small>
    </div>
  </div>

  <aside>
    <div class="card">
      <h2>Live</h2>
      <div class="body">
        <div class="swatch" id="swatch"><span id="hex">—</span><span id="xy"></span></div>
        <div class="zonebits" id="zonebits"></div>
        <div class="kv"><b>posts</b><span id="s-posts">–</span></div>
        <div class="kv"><b>per second</b><span id="s-rate">–</span></div>
        <div class="kv"><b>frame age</b><span id="s-age">–</span></div>
        <div class="kv"><b>prep</b><span id="s-prep">–</span></div>
        <div class="kv"><b>cycle</b><span id="s-cycle">–</span></div>
        <div class="kv"><b>pace / transition</b><span id="s-pace">–</span></div>
        <div class="kv"><b>busy · stalls · timeouts</b><span id="s-err">–</span></div>
        <div class="kv"><b>idle</b><span id="s-idle">–</span></div>
      </div>
    </div>
  </aside>
</main>

<div id="toast"></div>

<script>
let META = [], CFG = {}, LIGHTS = [], dirty = false, lastPosts = null, lastPostT = null, rate = 0;

const $ = (id) => document.getElementById(id);
const toast = (msg, err) => {
  const t = $("toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(t._t); t._t = setTimeout(() => (t.className = ""), err ? 6000 : 2500);
};

function parseMap(text) {
  const out = [];
  (text || "").split(";").forEach((chunk) => {
    chunk = chunk.trim(); if (!chunk) return;
    const [entity, zones] = chunk.split("=");
    const set = new Set();
    const spec = (zones || "all").trim().toLowerCase();
    if (spec === "all" || spec === "*" || spec === "") { for (let i = 1; i <= 9; i++) set.add(i); }
    else spec.replace(/\s/g, "").split(",").forEach((p) => {
      if (p.includes("-")) { const [a, b] = p.split("-"); for (let i = +a; i <= +b; i++) set.add(i); }
      else if (p) set.add(+p);
    });
    out.push({ entity: (entity || "").trim(), zones: set });
  });
  return out;
}
function serializeMap(list) {
  return list.filter((l) => l.entity.trim())
    .map((l) => {
      const z = [...l.zones].sort((a, b) => a - b);
      return l.entity.trim() + "=" + (z.length === 9 ? "all" : z.join(","));
    }).join("; ");
}

function renderLights() {
  const box = $("lights"); box.innerHTML = "";
  if (!LIGHTS.length) {
    box.innerHTML = '<small class="mono">No lights yet — add one, or leave LIGHT_MAP empty to drive the '
      + 'entity from HA_URL defaults.</small>';
  }
  LIGHTS.forEach((light, i) => {
    const row = document.createElement("div"); row.className = "light";
    const name = document.createElement("input");
    name.type = "text"; name.value = light.entity; name.placeholder = "light.left_lamp";
    name.oninput = () => { LIGHTS[i].entity = name.value; dirty = true; };
    const zones = document.createElement("div"); zones.className = "zones";
    for (let z = 1; z <= 9; z++) {
      const b = document.createElement("button");
      b.textContent = z; b.className = light.zones.has(z) ? "on" : "";
      b.onclick = () => {
        light.zones.has(z) ? light.zones.delete(z) : light.zones.add(z);
        b.className = light.zones.has(z) ? "on" : ""; dirty = true;
      };
      zones.appendChild(b);
    }
    const del = document.createElement("button");
    del.className = "btn danger"; del.textContent = "✕";
    del.onclick = () => { LIGHTS.splice(i, 1); dirty = true; renderLights(); };
    row.append(name, zones, del);
    box.appendChild(row);
  });
}
function addLight() { LIGHTS.push({ entity: "", zones: new Set([1, 2, 3, 4, 5, 6, 7, 8, 9]) }); dirty = true; renderLights(); }

function control(meta, value) {
  const wrap = document.createElement("div"); wrap.className = "ctl";
  if (meta.type === "bool") {
    const l = document.createElement("label"); l.className = "switch";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!value;
    const sp = document.createElement("span");
    cb.onchange = () => { CFG[meta.name] = cb.checked; dirty = true; };
    l.append(cb, sp); wrap.appendChild(l); return wrap;
  }
  if (meta.type === "enum") {
    const sel = document.createElement("select");
    meta.values.forEach((v) => {
      const o = document.createElement("option"); o.value = v; o.textContent = v;
      if (v === value) o.selected = true; sel.appendChild(o);
    });
    sel.onchange = () => { CFG[meta.name] = sel.value; dirty = true; };
    wrap.appendChild(sel); return wrap;
  }
  if (meta.type === "float" || meta.type === "int") {
    const r = document.createElement("input");
    r.type = "range"; r.min = meta.min ?? 0; r.max = meta.max ?? 100;
    r.step = meta.step ?? (meta.type === "int" ? 1 : 0.01); r.value = value;
    const num = document.createElement("input");
    num.type = "number"; num.min = r.min; num.max = r.max; num.step = r.step; num.value = value;
    const sync = (v) => {
      v = Math.min(+r.max, Math.max(+r.min, +v)); CFG[meta.name] = v;
      r.value = v; num.value = v; dirty = true;
    };
    r.oninput = () => sync(r.value); num.onchange = () => sync(num.value);
    wrap.append(r, num); return wrap;
  }
  const t = document.createElement("input"); t.type = "text"; t.value = value ?? "";
  t.oninput = () => { CFG[meta.name] = t.value; dirty = true; };
  wrap.appendChild(t); return wrap;
}

function renderSettings(meta) {
  const groups = {};
  meta.filter((m) => m.name !== "LIGHT_MAP").forEach((m) => (groups[m.group] ||= []).push(m));
  const host = $("settings"); host.innerHTML = "";
  Object.entries(groups).forEach(([group, items]) => {
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<h2>${group}</h2>`;
    const body = document.createElement("div"); body.className = "body";
    items.forEach((m) => {
      const row = document.createElement("div"); row.className = "row";
      const left = document.createElement("div");
      left.innerHTML = `<div class="label">${m.label}</div><div class="help">${m.help || ""}</div>`;
      row.append(left, control(m, CFG[m.name]));
      body.appendChild(row);
    });
    card.appendChild(body); host.appendChild(card);
  });
}

async function reload() {
  const r = await fetch("/api/config");
  const data = await r.json();
  META = data.meta; CFG = data.settings;
  LIGHTS = parseMap(CFG.LIGHT_MAP || "");
  $("cfgpath").textContent = data.config_path;
  $("hapill").textContent = data.ha_url;
  renderSettings(META); renderLights(); dirty = false;
}

async function save() {
  CFG.LIGHT_MAP = serializeMap(LIGHTS);
  const r = await fetch("/api/config", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ settings: CFG }),
  });
  const data = await r.json();
  if (!data.ok) { toast("Rejected: " + data.errors.join(" · "), true); return; }
  toast("Saved & applied" + (data.restart_required.length
    ? " · restart for " + data.restart_required.join(", ") : ""));
  dirty = false; reload();
}

async function resetDefaults() {
  if (!confirm("Reset every setting to its default and rewrite config.json?")) return;
  const r = await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ reset: true }) });
  const data = await r.json();
  if (!data.ok) { toast("Rejected: " + data.errors.join(" · "), true); return; }
  toast("Defaults restored"); reload();
}

function hexFromXy(x, y) {
  if (x == null || y == null || y <= 0) return null;
  const X = x / y, Y = 1, Z = (1 - x - y) / y;
  let r = 3.2406 * X - 1.5372 * Y - 0.4986 * Z;
  let g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z;
  let b = 0.0557 * X - 0.2040 * Y + 1.0570 * Z;
  const enc = (v) => {
    v = Math.max(0, Math.min(1, v));
    return v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  };
  const ch = [enc(r), enc(g), enc(b)].map((v) => Math.round(v * 255));
  return "#" + ch.map((v) => v.toString(16).padStart(2, "0")).join("");
}

async function tick() {
  try {
    const h = await fetch("/health").then((r) => r.json());
    $("dot").className = "dot on"; $("conn").textContent = "connected";
    const s = h.stats || {};
    const now = performance.now();
    if (lastPosts !== null && lastPostT !== null && s.posts >= lastPosts) {
      const dt = (now - lastPostT) / 1000;
      if (dt > 0.3) { rate = (s.posts - lastPosts) / dt; lastPosts = s.posts; lastPostT = now; }
    } else { lastPosts = s.posts ?? 0; lastPostT = now; }
    $("s-posts").textContent = s.posts ?? "–";
    $("s-rate").textContent = rate ? rate.toFixed(1) + " /s" : "–";
    $("s-age").textContent = s.age_ms != null ? s.age_ms.toFixed(0) + " ms" : "–";
    $("s-prep").textContent = s.prep_ms != null ? s.prep_ms.toFixed(1) + " ms" : "–";
    $("s-cycle").textContent = s.cycle_ms != null ? s.cycle_ms.toFixed(0) + " ms" : "–";
    $("s-pace").textContent = (s.pace_ms ?? "–") + " ms / " + (s.transition ?? "–") + " s";
    $("s-err").textContent = `${s.busy ?? 0} · ${s.radio_stalls ?? 0} · ${s.timeouts ?? 0}`;
    $("s-idle").textContent = s.idle ? "yes" : "no";

    const zones = await fetch("/regions").then((r) => r.json()).catch(() => null);
    if (zones && zones.zones && zones.zones.length === 9) {
      const zb = $("zonebits"); zb.innerHTML = "";
      zones.zones.forEach((z, i) => {
        const d = document.createElement("div");
        d.title = "zone " + (i + 1);
        d.style.background = z.xy ? hexFromXy(z.xy[0], z.xy[1]) || "#222932" : "#222932";
        zb.appendChild(d);
      });
    }
    const light = (h.lights || [])[0];
    const col = light && light.colour;
    if (col && col.xy) {
      const hex = hexFromXy(col.xy[0], col.xy[1]) || "#000000";
      $("swatch").style.background = hex;
      $("hex").textContent = hex;
      $("xy").textContent = `xy ${col.xy[0]}, ${col.xy[1]} · bri ${light.last_sent ? light.last_sent.brightness : "–"}`;
    }
  } catch (e) {
    $("dot").className = "dot bad"; $("conn").textContent = "offline";
  }
}

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
reload().then(() => { tick(); setInterval(tick, 1000); });
</script>
</body>
</html>
